name: PR Title Compliance

on:
    pull_request:
        types: [opened, edited, synchronize, reopened]

jobs:
    pr-title:
        name: PR Title Convention
        runs-on: ubuntu-latest
        steps:
            - name: Validate PR title
              run: |
                  TITLE="${{ github.event.pull_request.title }}"
                  PATTERN="^(feat|fix|hotfix|build|chore|refactor|ci|docs|test|perf|revert)(\([a-z0-9-]+\))?: .{1,100}$"
                  if [[ ! "$TITLE" =~ $PATTERN ]]; then
                    echo "PR title '$TITLE' does not follow convention. Expected: type(scope): description"
                    exit 1
                  fi
