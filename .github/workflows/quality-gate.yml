name: Core Domain CI

on:
    pull_request:
        branches:
            - main

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    quality-gate:
        name: Statistics Analysis & compilation
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9

            - name: Configure Node.js Environment
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: 'pnpm'

            - name: Initialize Next.js Build Cache
              uses: actions/cache@v4
              with:
                  path: ${{ github.workspace }}/.next/cache
                  key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.[jt]s', '**/*.[jt]sx', '**/*.css', '**/*.json', '**/*.md') }}
                  restore-keys: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}

            - name: Deterministic Dependency Installation
              run: pnpm install --frozen-lockfile

            - name: Generate Prisma Client
              run: pnpm prisma generate --schema=prisma/schema.prisma

            - name: Execute Code Formatting Check
              run: pnpm run format:check

            - name: Execute Strict linting
              run: pnpm run lint

            - name: Execute Type Check
              run: pnpm tsc --noEmit

            - name: Execute Unit Tests
              run: pnpm run test

            - name: Execute Production build
              env:
                  NEXT_TELEMETRY_DISABLED: 1
              run: pnpm run build
