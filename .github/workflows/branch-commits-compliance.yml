name: Branch & Commit Compliance

on:
    push:
        branches-ignore:
            - main

jobs:
    branch-name:
        name: Branch Naming Convention
        runs-on: ubuntu-latest
        steps:
            - name: Validate branch name
              run: |
                  BRANCH="${{ github.ref_name }}"
                  STANDARD_PATTERN="^(feat|fix|hotfix|build|chore|refactor|ci|docs|test|perf|revert)(\/[0-9]+-[a-z0-9-]+|\/[a-z0-9-]+)$"
                  GITHUB_REVERT_PATTERN="^revert-[0-9]+-.+$"

                  if [[ ! "$BRANCH" =~ $STANDARD_PATTERN && ! "$BRANCH" =~ $GITHUB_REVERT_PATTERN ]]; then
                    echo "Error: Branch name '$BRANCH' does not follow convention."
                    echo "Expected standard format: type/123-simple-description or type/simple-description"
                    echo "Expected GitHub revert format: revert-<pr-number>-<original-branch-name>"
                    exit 1
                  fi

    commit-messages:
        name: Commit Message Convention
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Validate commit messages
              run: |
                  PATTERN="^(feat|fix|hotfix|build|chore|refactor|ci|docs|test|perf|revert)(\([a-z0-9-]+\))?: .{1,100}$"
                  COMMITS=$(git log origin/main..HEAD --pretty=format:"%s")
                  if [[ -z "$COMMITS" ]]; then
                    echo "No commits found to validate."
                    exit 0
                  fi

                  while IFS= read -r COMMIT || [[ -n "$COMMIT" ]]; do

                    if [[ -z "$COMMIT" ]]; then
                      continue
                    fi

                    if [[ ! "$COMMIT" =~ $PATTERN ]]; then
                      echo "Commit message '$COMMIT' does not follow convention. Expected: type(scope): description"
                      exit 1
                    fi
                  done <<< "$COMMITS"
