services:
    postgres:
        image: postgres:15-alpine
        container_name: postgres
        restart: always
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        volumes:
            - pg_prod_data:/var/lib/postgresql/data
        networks:
            - pos-erp-network

    nextjs:
        image: ghcr.io/mahmoudalfalah/pos-erp-system:latest
        container_name: pos-erp-system
        restart: always
        environment:
            DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
            NODE_ENV: production
        networks:
            - pos-erp-network
        depends_on:
            - postgres

    nginx:
        image: nginx:alpine
        container_name: nginx
        restart: always
        ports:
            - '80:80'
            - '443:443'
        volumes:
            - ./nginx/conf.d:/etc/nginx/conf.d:ro
        networks:
            - pos-erp-network

volumes:
    pg_prod_data:

networks:
    pos-erp-network:
        driver: bridge
